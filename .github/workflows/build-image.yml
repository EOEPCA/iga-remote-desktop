name: build

on:
  push:
    branches: [develop, main]
    tags:
      - 'v*'
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------
  # Resolve release tag from ref
  # ------------------------------------------------------------
  release-meta:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned yq
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 -o yq
          sudo install yq /usr/local/bin/yq
      - id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            TAG="pr-test"
          elif [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            TAG="latest-dev"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAG="latest"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"

            # --------------------------------------------------
            # Validate against release.yaml
            # --------------------------------------------------
            RELEASE_VERSION=$(yq -r '.image_version' release.yaml)

            if [[ -z "${RELEASE_VERSION}" || "${RELEASE_VERSION}" == "null" ]]; then
              echo "image_version not found in release.yaml"
              exit 1
            fi

            if [[ "${TAG}" != "${RELEASE_VERSION}" ]]; then
              echo "Git tag v${TAG} does not match release.yaml version ${RELEASE_VERSION}"
              exit 1
            fi
          else
            echo "Unsupported ref ${GITHUB_REF}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------
  # Build, scan, SBOM, push
  # ------------------------------------------------------------
  build-scan-push:
    needs: release-meta
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq skopeo
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 -o yq
          sudo install yq /usr/local/bin/yq
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.2/oras_1.2.2_linux_amd64.tar.gz | tar -xz oras
          sudo install oras /usr/local/bin/oras

      - name: Build image with Buildx (to tar)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          outputs: type=docker,dest=image.tar

      # --------------------------------------------------------
      # Trivy scan is report-only until a vulnerability gate is agreed.
      # --------------------------------------------------------
      - name: Trivy scan (report-only)
        uses: docker://aquasec/trivy:0.76.2
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          args: >
            image
            --input image.tar
            --severity HIGH,CRITICAL
            --exit-code 0
            --no-progress

      - name: Generate SBOM (SPDX JSON)
        uses: docker://aquasec/trivy:0.76.2
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          args: >
            image
            --input image.tar
            --format spdx-json
            --output sbom.spdx.json

      - name: Retain SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.run_id }}
          path: sbom.spdx.json
          retention-days: 7

      # --------------------------------------------------------
      # Publish the tested image archive
      # --------------------------------------------------------
      - name: Push image with Skopeo
        if: github.event_name != 'pull_request'
        id: push
        run: |
          set -euo pipefail

          TAG=${{ needs.release-meta.outputs.tag }}
          REGISTRY=$(yq -r '.image_registry' release.yaml)
          IMAGE_PREFIX=$(yq -r '.image_prefix' release.yaml)
          IMAGE=$(yq -r '.image_name' release.yaml)

          IMAGE_REF="${REGISTRY}/${IMAGE_PREFIX}/${IMAGE}:${TAG}"

          skopeo copy \
            --dest-creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            docker-archive:image.tar \
            docker://${IMAGE_REF}

          DIGEST=$(skopeo inspect \
            --creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            docker://${IMAGE_REF} \
            | jq -r .Digest)

          echo "${REGISTRY}/${IMAGE_PREFIX}/${IMAGE}@${DIGEST}" > image.digest
